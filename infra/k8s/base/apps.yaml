apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth
  namespace: messenger
  labels:
    messenger-step: '5'
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/part-of: messenger
      app.kubernetes.io/component: auth
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: messenger
        app.kubernetes.io/component: auth
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 20
      containers:
      - name: auth
        image: messenger-auth:step5
        imagePullPolicy: IfNotPresent
        env:
        - name: PGHOST
          value: postgres
        - name: PGPORT
          value: '5432'
        - name: PGDATABASE
          value: auth_db
        - name: PGUSER
          value: auth_app
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              name: auth-db
              key: password
        - name: JWT_PUBLIC_KEY_FILE
          value: /run/public/auth-public.pem
        - name: APP_ORIGIN
          value: http://127.0.0.1:8000
        - name: JWT_PRIVATE_KEY_FILE
          value: /run/private/auth-private.pem
        - name: INTERNAL_AUTH_SECRET_FILE
          value: /run/internal/internal-auth.secret
        - name: COOKIE_SECURE
          value: 'false'
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 384Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          runAsNonRoot: true
          runAsUser: 10001
          runAsGroup: 10001
          seccompProfile:
            type: RuntimeDefault
        ports:
        - name: http
          containerPort: 8000
        readinessProbe:
          httpGet:
            path: /health/ready
            port: http
          periodSeconds: 5
          timeoutSeconds: 4
          failureThreshold: 6
        livenessProbe:
          httpGet:
            path: /health/live
            port: http
          periodSeconds: 5
          timeoutSeconds: 4
          failureThreshold: 6
        startupProbe:
          httpGet:
            path: /health/live
            port: http
          periodSeconds: 5
          timeoutSeconds: 4
          failureThreshold: 60
        volumeMounts:
        - name: public-key
          mountPath: /run/public
          readOnly: true
        - name: private-key
          mountPath: /run/private
          readOnly: true
        - name: internal-secret
          mountPath: /run/internal
          readOnly: true
      volumes:
      - name: public-key
        configMap:
          name: auth-public
      - name: private-key
        secret:
          secretName: auth-private
          defaultMode: 292
      - name: internal-secret
        secret:
          secretName: auth-internal
          defaultMode: 292
      enableServiceLinks: false
---
