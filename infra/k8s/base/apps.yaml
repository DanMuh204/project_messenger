apiVersion: apps/v1
kind: Deployment
metadata:
  name: proxy
  namespace: messenger
  labels:
    messenger-step: '5'
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/part-of: messenger
      app.kubernetes.io/component: proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: messenger
        app.kubernetes.io/component: proxy
    spec:
      automountServiceAccountToken: false
      containers:
      - name: proxy
        image: haproxy:3.2-alpine
        ports:
        - name: http
          containerPort: 8000
        volumeMounts:
        - name: config
          mountPath: /usr/local/etc/haproxy
          readOnly: true
        resources:
          requests:
            cpu: 50m
            memory: 32Mi
          limits:
            cpu: 300m
            memory: 128Mi
        readinessProbe:
          tcpSocket:
            port: 8000
          periodSeconds: 5
        livenessProbe:
          tcpSocket:
            port: 8000
          periodSeconds: 10
      volumes:
      - name: config
        configMap:
          name: haproxy-k8s
      enableServiceLinks: false
