global
    log stdout format raw local0
    maxconn 2000

defaults
    log global
    mode http
    option httplog
    timeout connect 3s
    timeout client 30s
    timeout server 30s
    timeout tunnel 1h
    default-server init-addr none resolvers kubernetes resolve-prefer ipv4

resolvers kubernetes
    nameserver dns __CLUSTER_DNS__:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 10s

frontend public
    bind :8000
    acl internal path_beg /internal
    http-request deny deny_status 404 if internal
    acl ws path /ws
    acl auth path_beg /auth/ /users/
    acl login path /auth/login /auth/register
    stick-table type ip size 10k expire 10m store http_req_rate(60s)
    http-request track-sc0 src if login
    http-request deny deny_status 429 if login { sc_http_req_rate(0) gt 30 }
    http-response set-header X-Content-Type-Options nosniff
    use_backend delivery if ws
    use_backend auth if auth
    default_backend chat

backend auth
    option httpchk GET /health/ready
    http-check expect status 200
    server auth auth.messenger.svc.cluster.local:8000 check inter 2s fall 2 rise 1

backend chat
    option httpchk GET /health/ready
    http-check expect status 200
    server chat chat.messenger.svc.cluster.local:8000 check inter 2s fall 2 rise 1

backend delivery
    option httpchk GET /health/ready
    http-check expect status 200
    server delivery delivery.messenger.svc.cluster.local:8000 check inter 2s fall 2 rise 1

